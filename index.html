<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>角色关系星图</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <!-- 顶部全局操作栏 -->
  <header id="topbar">
    <button id="btnUndo" class="tb-btn" title="上一步">↩︎</button>
    <button id="btnRedo" class="tb-btn" title="下一步">↪︎</button>
    <div id="titleBox" class="tb-title" title="点击修改图名">未命名关系图</div>
    <button id="btnMenu" class="tb-btn" title="菜单">☰</button>
  </header>

  <!-- 视图指示条（代理视图）：当前缩放百分比 + 操作提示 -->
  <div id="viewstrip">
    <span id="zoomLabel">100%</span>
    <span id="viewHint">双指缩放 · 拖动空白平移</span>
  </div>

  <!-- 画布区 -->
  <div id="stage">
    <svg id="svg" width="100%" height="100%">
      <g id="vp">
        <rect id="bg" x="-20000" y="-20000" width="40000" height="40000" fill="#ffffff"></rect>
        <g id="orbitsG"></g>
        <g id="linksG"></g>
        <g id="ghostG"></g>
        <g id="nodesG"></g>
        <g id="overlayG"></g>
      </g>
    </svg>
    <!-- 画布左下角连线笔刷状态预览 -->
    <div id="brushPreview" class="hidden"></div>
    <!-- 画布内图例角标 -->
    <div id="legendChip"></div>
    <!-- 布局模式：角色选中后的快捷操作条 -->
    <div id="nodeOps" class="hidden">
      <select id="opsRingSel"></select>
      <button id="opsCenter" class="mini-btn"><img class="pm-star" src="assets/icons/star-line.svg" alt="">设为圆心</button>
      <button id="opsDel" class="mini-btn danger">🗑删除</button>
      <button id="opsClose" class="mini-btn">✕</button>
    </div>
  </div>

  <!-- 二级菜单面板 -->
  <section id="panel" class="panel"></section>

  <!-- 底部模式栏 -->
  <nav id="tabs">
    <button class="tab" data-tab="style">🎨样式</button>
    <button class="tab" data-tab="person">👤人物</button>
    <button class="tab" data-tab="link">💑连线</button>
    <button class="tab" data-tab="layout">🌐布局</button>
    <button class="tab" data-tab="hand">👋抓手</button>
  </nav>
</div>

<!-- 弹窗容器（菜单/文本/输入/确认） -->
<div id="modalRoot" class="hidden">
  <div id="modalMask"></div>
  <div id="modalBox"></div>
</div>

<!-- 菜单 -->
<div id="menuRoot" class="hidden">
  <div id="menuMask"></div>
  <div id="menuBox">
    <div class="menu-group">帮助</div>
    <div class="menu-item" data-menu="help">❓ 帮助</div>
    <div class="menu-sep"></div>
    <div class="menu-group">工具</div>
    <div class="menu-item" data-menu="new">🆕 建立新连线图</div>
    <div class="menu-sep"></div>
    <div class="menu-group">发布</div>
    <div class="menu-item" data-menu="publish">📝 发布笔记</div>
    <div class="menu-sep"></div>
    <div class="menu-group">导出</div>
    <div class="menu-item" data-menu="img">🖼 导出为图片</div>
    <div class="menu-item" data-menu="expnames">📤 导出人物名单</div>
    <div class="menu-item" data-menu="expsnap">📦 导出布局·人物·图例</div>
    <div class="menu-sep"></div>
    <div class="menu-group">导入</div>
    <div class="menu-item" data-menu="impnames">📥 导入人物名单</div>
    <div class="menu-item" data-menu="impsnap">📦 导入布局·人物·图例</div>
    <div class="menu-sep"></div>
    <div class="menu-item" data-menu="about">ℹ️ 关于</div>
  </div>
</div>

  <!-- Toast -->
<div id="toast" class="hidden"></div>

<!-- 全屏(隐藏UI)退出按钮 -->
<button id="fullExit" class="hidden" title="退出全屏">✕</button>

<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/render.js"></script>
<script src="js/io.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
